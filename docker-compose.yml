version: "3.9"

services:
  lexai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lexai-legal-aid
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist ChromaDB vector store and legal corpus between restarts
      - chroma_data:/app/data/chroma_db
      - legal_corpus:/app/data/legal_corpus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  chroma_data:
  legal_corpus:
